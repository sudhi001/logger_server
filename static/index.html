<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs · logger_server</title>
  <link href="app.css" rel="stylesheet">
</head>
<body>
  <div class="topbar">
    <a href="/" class="brand">{SUDHI<span>.</span>S}</a>
    <a href="/" class="nav-link active">Logs</a>
    <a href="/devices.html" class="nav-link">Devices</a>

    <input type="text" id="search" placeholder="filter messages…" autocomplete="off">

    <select id="level">
      <option value="0">all levels</option>
      <option value="1">debug+</option>
      <option value="2">info+</option>
      <option value="3">warn+</option>
      <option value="4">error only</option>
    </select>

    <select id="device"><option value="">all devices</option></select>

    <button id="pause" title="Freeze the view (space)">Pause</button>
    <button id="follow" class="on" title="Scroll to newest">Follow</button>
    <button id="clear" title="Empty the view">Clear</button>
    <button id="copy" title="Copy visible lines as JSON">Copy</button>

    <div class="spacer"></div>
    <div class="status"><span class="dot" id="dot"></span><span id="conn">connecting</span></div>
    <a href="#" class="nav-link" id="logout">Sign out</a>
  </div>

  <div id="logs"><div class="empty">Waiting for logs…</div></div>

  <div class="statusbar">
    <span id="count">0 lines</span>
    <span id="shown"></span>
    <span class="spacer"></span>
    <span class="dim">click a line to expand · space to pause</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
