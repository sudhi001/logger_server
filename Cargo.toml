[package]
name = "logger_server"
version = "3.3.0"
edition = "2021"
rust-version = "1.80"
description = "Self-hosted remote logger for mobile apps: live browser tail, per-device tokens, webhook alerting, and an MCP endpoint for AI agents"
license = "MIT"
repository = "https://github.com/sudhi001/logger_server"
homepage = "https://github.com/sudhi001/logger_server"
documentation = "https://github.com/sudhi001/logger_server/blob/main/docs/quickstart.md"
readme = "README.md"
keywords = ["logging", "logger", "mobile", "observability", "mcp"]
categories = [
    "development-tools::debugging",
    "web-programming::http-server",
    "command-line-utilities",
]
# static/ is compiled into the binary with include_bytes!, so it must ship.
# docs/ is 500 KB of screenshots; crates.io resolves relative links against the
# repository, so the README still renders them without carrying the weight.
exclude = [
    "docs/",
    "Dockerfile*",
    ".dockerignore",
    ".github/",
    "tests/",
]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", features = ["trace", "cors", "limit", "catch-panic", "compression-gzip", "timeout"] }
http-body-util = "0.1"
bytes = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
governor = { version = "0.10", default-features = false, features = ["std", "jitter", "quanta"] }
tracing = "0.1"
# Token hashing: API tokens are high-entropy random values, so a plain digest
# is the right primitive here — a slow password KDF would buy nothing.
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
# Outbound webhook delivery. rustls with compiled-in roots is not a preference:
# the scratch image has no CA bundle, so the system trust store is not there to
# read. default-features off keeps native-tls and cookies out of the binary.
# rustls-no-provider + an explicit ring provider: aws-lc-rs is ~686 KB of C and
# assembly, and ring does the same job here in a fraction of the space. No
# http2 — every webhook target speaks HTTP/1.1 — and no charset, because we POST
# JSON and never read the response body.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "webpki-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Root certificates compiled into the binary. The scratch image has no system
# trust store, so these are the only roots available at runtime.
webpki-roots = "1"
url = "2"
# `env-filter` pulls regex-automata and regex-syntax, ~219 KB, to support
# filter syntax this server does not use. `Targets` parses the same
# `target=level` form without a regex engine.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
default = []
# Enabled for musl builds: musl's allocator degrades badly under multi-thread
# contention. Irrelevant (and unused) on glibc, where the system allocator wins.
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# io-util is needed only by the tests, which speak HTTP over a raw socket.
tokio = { version = "1", features = ["io-util"] }

[profile.release]
# "s" over 3: measured at ~68k logs/second instead of ~75k, a 9.5% cost, for
# 1.3 MB less binary. Both numbers are far past what a debugging tool sees, and
# the binary is file-backed resident memory on every instance, permanently.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
# Deliberately NOT "abort": a panicking handler must not take down a log sink.
# Paired with tower_http::catch_panic::CatchPanicLayer.
panic = "unwind"
