<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" role="img" aria-label="Two credentials: a device token can only write logs; the admin token or a dashboard session can read logs and manage devices.">
  <defs>
    <style>
      .bg    { fill: #0b0e14; }
      .panel { fill: #11151f; stroke: #222836; stroke-width: 1; }
      .t     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1d9; }
      .dim   { fill: #6e7891; }
      .ok    { fill: #3fb950; }
      .err   { fill: #f85149; }
      .accent{ fill: #4c9aff; }
      .hd    { font-size: 13px; font-weight: 700; }
      .body  { font-size: 11.5px; }
      .tiny  { font-size: 10.5px; }
    </style>
  </defs>

  <rect class="bg" width="880" height="300" rx="10"/>

  <!-- device token -->
  <rect class="panel" x="28" y="28" width="396" height="244" rx="8"/>
  <text class="t ok hd" x="52" y="58">DEVICE TOKEN</text>
  <text class="t dim tiny" x="52" y="76">lgrd_… — one per app build or tester</text>

  <rect x="52" y="92" width="348" height="30" rx="5" fill="#0b0e14" stroke="#222836"/>
  <text class="t accent tiny" x="64" y="112">Authorization: Bearer lgrd_nZQa6MFVrSzk…</text>

  <text class="t ok body" x="52" y="150">✓  write logs</text>
  <text class="t err body" x="52" y="174">✕  read logs</text>
  <text class="t err body" x="52" y="196">✕  see other devices</text>
  <text class="t err body" x="52" y="218">✕  manage anything</text>

  <text class="t dim tiny" x="52" y="248">Ships inside your app. Stored only as a hash.</text>
  <text class="t dim tiny" x="52" y="263">Revoking it takes effect on the next request.</text>

  <!-- viewer -->
  <rect class="panel" x="456" y="28" width="396" height="244" rx="8"/>
  <text class="t accent hd" x="480" y="58">ADMIN TOKEN  /  SESSION</text>
  <text class="t dim tiny" x="480" y="76">lgra_… — yours, or a cookie from signing in</text>

  <rect x="480" y="92" width="348" height="30" rx="5" fill="#0b0e14" stroke="#222836"/>
  <text class="t accent tiny" x="492" y="112">x-admin-token: lgra_…   ·   the dashboard login</text>

  <text class="t ok body" x="480" y="150">✓  read logs and the live stream</text>
  <text class="t ok body" x="480" y="174">✓  create and revoke devices</text>
  <text class="t ok body" x="480" y="196">✓  read /metrics</text>
  <text class="t err body" x="480" y="218">✕  never ship this in an app</text>

  <text class="t dim tiny" x="480" y="248">Only /healthz and the login page are public,</text>
  <text class="t dim tiny" x="480" y="263">so a platform health check still works.</text>
</svg>
