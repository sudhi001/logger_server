<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" role="img" aria-label="Internal architecture: writes go through a bounded queue to a single writer thread and into SQLite, and simultaneously into a fixed-size broadcast ring for live subscribers. Reads use a separate read-only pool with a streaming cursor.">
  <defs>
    <style>
      .bg    { fill: #0b0e14; }
      .panel { fill: #11151f; stroke: #222836; stroke-width: 1; }
      .zone  { fill: none; stroke: #222836; stroke-width: 1; stroke-dasharray: 4 4; }
      .t     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1d9; }
      .dim   { fill: #6e7891; }
      .accent{ fill: #4c9aff; }
      .ok    { fill: #3fb950; }
      .warn  { fill: #e3b341; }
      .hd    { font-size: 12px; font-weight: 700; }
      .body  { font-size: 11px; }
      .tiny  { font-size: 10px; }
      .fl    { stroke: #4c9aff; stroke-width: 1.6; fill: none; }
      .fl2   { stroke: #e3b341; stroke-width: 1.6; fill: none; }
      .fl3   { stroke: #3fb950; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4c9aff"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>

  <rect class="bg" width="880" height="470" rx="10"/>

  <!-- write path -->
  <text class="t accent hd" x="28" y="34">WRITE PATH</text>

  <rect class="panel" x="28" y="48" width="150" height="62" rx="7"/>
  <text class="t body" x="103" y="72" text-anchor="middle">POST /logs</text>
  <text class="t dim tiny" x="103" y="90" text-anchor="middle">rate limit → token</text>
  <text class="t dim tiny" x="103" y="103" text-anchor="middle">→ validate</text>

  <path class="fl" marker-end="url(#c)" d="M186 79 L 214 79"/>

  <rect class="panel" x="222" y="48" width="150" height="62" rx="7"/>
  <text class="t body" x="297" y="72" text-anchor="middle">id + serialise</text>
  <text class="t dim tiny" x="297" y="90" text-anchor="middle">AtomicU64; frame</text>
  <text class="t dim tiny" x="297" y="103" text-anchor="middle">built exactly once</text>

  <!-- split -->
  <path class="fl"  marker-end="url(#c)" d="M380 68 L 404 68 L 404 150 L 428 150"/>
  <path class="fl2" marker-end="url(#d)" d="M380 90 L 404 90 L 404 316 L 428 316"/>

  <text class="t accent body" x="28" y="176">One line, two destinations,</text>
  <text class="t accent body" x="28" y="193">taken at the same moment:</text>
  <text class="t dim tiny" x="28" y="218">The durable path can lag by a</text>
  <text class="t dim tiny" x="28" y="232">few milliseconds without the</text>
  <text class="t dim tiny" x="28" y="246">live path waiting for it.</text>
  <text class="t dim tiny" x="28" y="272">Neither queue can grow without</text>
  <text class="t dim tiny" x="28" y="286">bound, which is what keeps</text>
  <text class="t dim tiny" x="28" y="300">memory flat under any load.</text>

  <!-- durable branch -->
  <rect class="panel" x="436" y="120" width="176" height="62" rx="7"/>
  <text class="t body" x="524" y="144" text-anchor="middle">bounded queue</text>
  <text class="t ok tiny" x="524" y="162" text-anchor="middle">8192 slots</text>
  <text class="t dim tiny" x="524" y="175" text-anchor="middle">full → 503, never grows</text>

  <path class="fl" marker-end="url(#c)" d="M620 151 L 648 151"/>

  <rect class="panel" x="656" y="120" width="196" height="62" rx="7"/>
  <text class="t body" x="754" y="144" text-anchor="middle">single writer thread</text>
  <text class="t dim tiny" x="754" y="162" text-anchor="middle">one transaction per batch</text>
  <text class="t dim tiny" x="754" y="175" text-anchor="middle">no lock contention</text>

  <path class="fl" marker-end="url(#c)" d="M754 190 L 754 226"/>

  <rect class="panel" x="656" y="234" width="196" height="54" rx="7"/>
  <text class="t ok body" x="754" y="256" text-anchor="middle">SQLite (WAL)</text>
  <text class="t dim tiny" x="754" y="274" text-anchor="middle">2 MiB cache, mmap off</text>

  <!-- live branch -->
  <rect class="panel" x="436" y="286" width="176" height="62" rx="7"/>
  <text class="t body" x="524" y="310" text-anchor="middle">broadcast ring</text>
  <text class="t warn tiny" x="524" y="328" text-anchor="middle">1024 frames, fixed</text>
  <text class="t dim tiny" x="524" y="341" text-anchor="middle">shared by refcount</text>

  <path class="fl2" marker-end="url(#d)" d="M620 317 L 648 317"/>

  <rect class="panel" x="656" y="298" width="196" height="76" rx="7"/>
  <text class="t body" x="754" y="320" text-anchor="middle">live subscribers (SSE)</text>
  <text class="t dim tiny" x="754" y="338" text-anchor="middle">~16 KB each</text>
  <text class="t warn tiny" x="754" y="354" text-anchor="middle">too slow → evicted,</text>
  <text class="t dim tiny" x="754" y="367" text-anchor="middle">reconnects and replays</text>

  <!-- read path -->
  <line x1="28" y1="392" x2="852" y2="392" stroke="#222836"/>
  <text class="t ok hd" x="28" y="418">READ PATH</text>

  <rect class="panel" x="140" y="400" width="176" height="52" rx="7"/>
  <text class="t body" x="228" y="422" text-anchor="middle">read-only pool</text>
  <text class="t dim tiny" x="228" y="440" text-anchor="middle">concurrent, WAL</text>

  <path class="fl3" marker-end="url(#e)" d="M324 426 L 352 426"/>

  <rect class="panel" x="360" y="400" width="200" height="52" rx="7"/>
  <text class="t body" x="460" y="422" text-anchor="middle">streaming cursor</text>
  <text class="t dim tiny" x="460" y="440" text-anchor="middle">row by row, in chunks</text>

  <path class="fl3" marker-end="url(#e)" d="M568 426 L 596 426"/>

  <rect class="panel" x="604" y="400" width="248" height="52" rx="7"/>
  <text class="t body" x="728" y="422" text-anchor="middle">flat memory, any table size</text>
  <text class="t dim tiny" x="728" y="440" text-anchor="middle">slow client backpressures the cursor</text>
</svg>
