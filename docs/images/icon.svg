<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="logger_server">
  <title>logger_server</title>
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="#0F172A" />
  
  <!-- Server Box Outline -->
  <rect x="50" y="70" width="100" height="70" rx="10" fill="none" stroke="#334155" stroke-width="6" />
  <line x1="50" y1="105" x2="150" y2="105" stroke="#334155" stroke-width="2" />
  
  <!-- Terminal Symbol (>) -->
  <polyline points="65,115 75,125 65,135" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Terminal Blinker (_) -->
  <line x1="82" y1="135" x2="95" y2="135" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  
  <!-- Remote Radar Signals -->
  <path d="M 125,95 A 15,15 0 0,0 145,75" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" />
  <path d="M 115,105 A 30,30 0 0,0 155,65" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" />
</svg>
